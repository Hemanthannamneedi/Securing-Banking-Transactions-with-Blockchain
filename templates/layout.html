<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>{% block page_title %}SecureChain Portal{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap');

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #f1f5f9;
            overflow-x: hidden;
        }

        /* Sidebar styling to match the reference image perfectly */
        .sidebar {
            background: #0B0E17;
            color: #94a3b8;
            height: 100vh;
            position: fixed;
            width: 280px;
            z-index: 50;
        }

        .main-content {
            margin-left: 280px;
            min-height: 100vh;
        }

        .nav-link {
            display: flex;
            align-items: center;
            padding: 16px 28px;
            font-weight: 600;
            font-size: 0.875rem;
            transition: all 0.3s;
            cursor: pointer;
            border-left: 4px solid transparent;
        }

        .nav-link:hover,
        .nav-link.active {
            background: rgba(255, 255, 255, 0.05);
            color: #22d3ee;
            border-left-color: #22d3ee;
        }

        /* Modern Cards */
        .card {
            background: white;
            border-radius: 12px;
            border-top: 4px solid #0891b2;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05);
            padding: 32px;
            animation: fadeIn 0.4s ease-in-out;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body class="flex">
    <aside class="sidebar shadow-2xl flex flex-col justify-between">
        <div>
            <div class="p-8 pb-4">
                <h1 class="text-2xl font-bold text-cyan-400">
                    {% block brand_name %}Admin Portal{% endblock %}
                </h1>
                <p class="text-[10px] text-slate-500 uppercase tracking-widest mt-1">{% block role %}Superuser Access{%
                    endblock %}</p>
            </div>
            <nav class="py-6 space-y-1 mt-4">
                {% block sidebar %}{% endblock %}
            </nav>
        </div>
        <div class="p-6">
            <a href="/"
                class="flex items-center justify-center w-full py-3 bg-slate-800/50 hover:bg-slate-700 text-white text-sm font-bold rounded-lg transition-all duration-300">
                <i class="fas fa-sign-out-alt mr-2"></i> Logout
            </a>
        </div>
    </aside>

    <main class="main-content w-full flex flex-col">
        <header
            class="bg-[#1e293b] px-12 py-10 shadow-lg border-b border-slate-700 text-white flex justify-between items-center bg-[url('https://www.transparenttextures.com/patterns/circuit-board.png')]">
            <h2 class="text-3xl font-bold tracking-tight" id="headerTitle">{% block header %}System Administration{%
                endblock %}</h2>
            {% block header_right %}{% endblock %}
        </header>
        <div class="p-10 -mt-8 relative z-10">
            {% block content %}{% endblock %}
        </div>
    </main>

    <script>
        function switchTab(event, tabId, title) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-link').forEach(el => el.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            if (event) event.currentTarget.classList.add('active');
            if (title) document.getElementById('headerTitle').innerText = title;
        }
    </script>
</body>

</html>
