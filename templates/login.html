<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Login | SecureChain</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap');

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            overflow: hidden;
        }

        @keyframes slideInRight {
            0% {
                transform: translateX(100%);
                opacity: 0;
            }

            100% {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .slide-in-right {
            animation: slideInRight 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .branding-bg {
            background: linear-gradient(135deg, #0f172a 0%, #0891b2 100%);
            position: relative;
        }

        .branding-bg::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: radial-gradient(rgba(255, 255, 255, 0.1) 1px, transparent 1px);
            background-size: 30px 30px;
            opacity: 0.3;
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        input[type="file"]::file-selector-button {
            border: none;
            background: #0f172a;
            color: white;
            padding: 6px 12px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            margin-right: 10px;
        }

        input[type="file"]::file-selector-button:hover {
            background: #0891b2;
        }
    </style>
</head>

<body class="bg-white flex h-screen w-full">

    <div class="hidden lg:flex lg:w-1/2 branding-bg flex-col justify-between p-16 text-white z-0">
        <div class="flex items-center gap-3"><i class="fas fa-shield-alt text-4xl text-cyan-300"></i>
            <h1 class="text-3xl font-extrabold tracking-tight">SecureChain</h1>
        </div>
        <div>
            <h2 class="text-5xl font-black leading-tight mb-6">Next-Generation<br>Banking Security.</h2>
            <p class="text-cyan-100 text-lg max-w-md">Experience immutable ledger technology and real-time fraud
                analysis.</p>
        </div>
        <div class="text-sm font-medium text-cyan-200/60">&copy; 2026 SecureChain Banking Network.</div>
    </div>

    <div
        class="w-full lg:w-1/2 flex items-center justify-center p-8 sm:p-12 lg:p-20 slide-in-right z-10 bg-white shadow-[-20px_0_40px_rgba(0,0,0,0.05)] overflow-y-auto no-scrollbar">
        <div class="w-full max-w-md my-auto">
            <div class="mb-10 text-center lg:text-left">
                <h3 class="text-3xl font-extrabold text-slate-800 capitalize" id="formTitle">{{ role }} Access</h3>
                <p class="text-slate-500 mt-2 font-medium" id="formSubtitle">Please enter your credentials.</p>
            </div>

            <div class="flex p-1 bg-slate-100 rounded-xl mb-8">
                <button type="button" onclick="toggleForm('login')" id="btnLogin"
                    class="flex-1 py-2.5 rounded-lg text-sm font-bold bg-white text-slate-800 shadow-sm transition-all">Login</button>
                <button type="button" onclick="toggleForm('register')" id="btnRegister"
                    class="flex-1 py-2.5 rounded-lg text-sm font-bold text-slate-500 hover:text-slate-800 transition-all">Register</button>
            </div>

            <form action="/login" method="POST" enctype="multipart/form-data" class="space-y-4">
                <input type="hidden" name="action" id="actionField" value="login">
                <input type="hidden" name="role" value="{{ role }}">

                <div><label class="block text-xs font-bold text-slate-500 uppercase mb-2">Email Address</label><input
                        type="email" name="email" required
                        class="w-full px-5 py-3.5 rounded-xl border border-slate-200 bg-slate-50 outline-none focus:ring-2 focus:ring-cyan-500 transition">
                </div>
                <div><label class="block text-xs font-bold text-slate-500 uppercase mb-2">Password</label><input
                        type="password" name="password" required
                        class="w-full px-5 py-3.5 rounded-xl border border-slate-200 bg-slate-50 outline-none focus:ring-2 focus:ring-cyan-500 transition">
                </div>

                <div id="registerFields" class="hidden space-y-4 border-t border-slate-100 pt-5 mt-2">

                    <div class="grid grid-cols-2 gap-4">
                        <div><label class="block text-xs font-bold text-slate-500 uppercase mb-2">First
                                Name</label><input type="text" name="first_name" id="firstNameInput"
                                class="w-full px-4 py-3 rounded-xl border border-slate-200 bg-slate-50 outline-none text-sm">
                        </div>
                        <div><label class="block text-xs font-bold text-slate-500 uppercase mb-2">Last
                                Name</label><input type="text" name="last_name" id="lastNameInput"
                                class="w-full px-4 py-3 rounded-xl border border-slate-200 bg-slate-50 outline-none text-sm">
                        </div>
                    </div>
                    <div><label class="block text-xs font-bold text-slate-500 uppercase mb-2">Mobile
                            Number</label><input type="text" name="mobile" id="mobileInput"
                            class="w-full px-5 py-3.5 rounded-xl border border-slate-200 bg-slate-50 outline-none text-sm focus:ring-2 focus:ring-cyan-500">
                    </div>

                    {% if role == 'user' %}
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-bold text-slate-500 uppercase mb-2">State</label>
                            <select name="state" id="stateSelect" onchange="populateDistricts()"
                                class="w-full px-4 py-3 rounded-xl border border-slate-200 bg-slate-50 outline-none text-sm text-slate-700">
                                <option value="">Select State...</option>
                                <option value="Andhra Pradesh">Andhra Pradesh</option>
                                <option value="Telangana">Telangana</option>
                                <option value="Karnataka">Karnataka</option>
                                <option value="Maharashtra">Maharashtra</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-500 uppercase mb-2">District</label>
                            <select name="district" id="districtSelect"
                                class="w-full px-4 py-3 rounded-xl border border-slate-200 bg-slate-50 outline-none text-sm text-slate-700">
                                <option value="">Select State First...</option>
                            </select>
                        </div>
                    </div>

                    <div><label class="block text-xs font-bold text-slate-500 uppercase mb-2">City / Town</label><input
                            type="text" name="city" placeholder="Enter City Name" id="cityInput"
                            class="w-full px-5 py-3.5 rounded-xl border border-slate-200 bg-slate-50 outline-none text-sm focus:ring-2 focus:ring-cyan-500">
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-slate-500 uppercase mb-2">Select Bank</label>
                        <select name="bank" id="bankInput"
                            class="w-full px-5 py-3.5 rounded-xl border border-slate-200 bg-slate-50 outline-none font-bold text-slate-700">
                            <option value="SBI">State Bank of India (SBI)</option>
                            <option value="HDFC">HDFC Bank</option>
                            <option value="AXIS">Axis Bank</option>
                            <option value="CANARA">Canara Bank</option>
                        </select>
                    </div>

                    <div class="space-y-3 bg-slate-50 p-4 rounded-xl border border-slate-200">
                        <p
                            class="text-xs font-black text-slate-800 uppercase tracking-widest border-b border-slate-200 pb-2 mb-3">
                            <i class="fas fa-id-card text-cyan-600 mr-2"></i> KYC Documents</p>
                        <div><label class="block text-xs font-bold text-slate-500 mb-1">User Photo
                                (JPG/PNG)</label><input type="file" name="photo" accept="image/*"
                                class="w-full text-sm text-slate-500"></div>
                        <div><label class="block text-xs font-bold text-slate-500 mb-1">Biometric
                                Fingerprint</label><input type="file" name="fingerprint" accept="image/*"
                                class="w-full text-sm text-slate-500"></div>
                        <div><label class="block text-xs font-bold text-slate-500 mb-1">Digital Signature</label><input
                                type="file" name="signature" accept="image/*" class="w-full text-sm text-slate-500">
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-slate-500 uppercase mb-2">Account Type</label>
                        <div class="grid grid-cols-2 gap-3">
                            <label
                                class="flex items-center justify-center px-4 py-3 border border-slate-200 bg-slate-50 rounded-xl cursor-pointer hover:border-cyan-400"><input
                                    type="radio" name="account_type" value="Savings Account" checked
                                    class="text-cyan-600 w-4 h-4"><span
                                    class="ml-2 text-sm font-bold text-slate-700">Savings</span></label>
                            <label
                                class="flex items-center justify-center px-4 py-3 border border-slate-200 bg-slate-50 rounded-xl cursor-pointer hover:border-cyan-400"><input
                                    type="radio" name="account_type" value="Current Account"
                                    class="text-cyan-600 w-4 h-4"><span
                                    class="ml-2 text-sm font-bold text-slate-700">Current</span></label>
                        </div>
                    </div>
                    {% endif %}
                </div>

                <button type="submit" id="submitBtn"
                    class="w-full bg-[#0f172a] text-white font-bold py-4 rounded-xl hover:bg-cyan-600 transition-all mt-6 shadow-lg">Authenticate</button>
            </form>
        </div>
    </div>

    <script>
        const districtData = {
            "Andhra Pradesh": ["Anantapur", "Chittoor", "East Godavari", "Guntur", "Krishna", "Kurnool", "Nellore", "Prakasam", "Srikakulam", "Visakhapatnam", "Vizianagaram", "West Godavari", "YSR Kadapa"],
            "Telangana": ["Adilabad", "Hyderabad", "Karimnagar", "Khammam", "Mahbubnagar", "Nalgonda", "Nizamabad", "Warangal"],
            "Karnataka": ["Bengaluru Urban", "Mysuru", "Mangaluru", "Hubballi", "Belagavi", "Ballari"],
            "Maharashtra": ["Mumbai", "Pune", "Nagpur", "Thane", "Nashik", "Aurangabad"]
        };

        function populateDistricts() {
            const stateSelect = document.getElementById("stateSelect");
            const districtSelect = document.getElementById("districtSelect");
            if (!stateSelect) return; // Ignore if not a user
            const selectedState = stateSelect.value;
            districtSelect.innerHTML = '<option value="">Select District...</option>';
            if (selectedState && districtData[selectedState]) {
                districtData[selectedState].forEach(function (district) {
                    const option = document.createElement("option"); option.value = district; option.text = district;
                    districtSelect.appendChild(option);
                });
            }
        }

        function toggleForm(type) {
            const actionField = document.getElementById('actionField');
            const regFields = document.getElementById('registerFields');
            const btnLogin = document.getElementById('btnLogin');
            const btnRegister = document.getElementById('btnRegister');
            const title = document.getElementById('formTitle');
            const submitBtn = document.getElementById('submitBtn');

            // Required Field Elements
            const fnInput = document.getElementById('firstNameInput');
            const lnInput = document.getElementById('lastNameInput');
            const moInput = document.getElementById('mobileInput');
            const bnkInput = document.getElementById('bankInput');
            const stSelect = document.getElementById('stateSelect');
            const ctyInput = document.getElementById('cityInput');

            if (type === 'register') {
                actionField.value = 'register'; regFields.classList.remove('hidden');

                fnInput.required = true; lnInput.required = true; moInput.required = true;
                if (bnkInput) { bnkInput.required = true; stSelect.required = true; ctyInput.required = true; }

                title.innerText = 'Create Account'; submitBtn.innerText = 'Register Now';
                btnRegister.classList.add('bg-white', 'text-slate-800', 'shadow-sm'); btnRegister.classList.remove('text-slate-500');
                btnLogin.classList.remove('bg-white', 'text-slate-800', 'shadow-sm'); btnLogin.classList.add('text-slate-500');
            } else {
                actionField.value = 'login'; regFields.classList.add('hidden');

                fnInput.required = false; lnInput.required = false; moInput.required = false;
                if (bnkInput) { bnkInput.required = false; stSelect.required = false; ctyInput.required = false; }

                title.innerText = '{{ role }} Access'; submitBtn.innerText = 'Authenticate';
                btnLogin.classList.add('bg-white', 'text-slate-800', 'shadow-sm'); btnLogin.classList.remove('text-slate-500');
                btnRegister.classList.remove('bg-white', 'text-slate-800', 'shadow-sm'); btnRegister.classList.add('text-slate-500');
            }
        }
    </script>
</body>

</html>
